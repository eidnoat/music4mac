name: iOS & iPadOS CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build and Package iOS / iPadOS IPA
        run: |
          chmod +x ./build_ios.sh
          ./build_ios.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-iOS-IPA
          path: music.ipa

      - name: Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            music.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
