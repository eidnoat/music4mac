name: iOS & iPadOS CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build and Package iOS / iPadOS IPA
        run: |
          chmod +x ./build_ios.sh
          ./build_ios.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-iOS-IPA
          path: music.ipa

      - name: Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ### 📦 Assets & Installation Guide

            - **`music.zip` (macOS Application Bundle)**
              - On macOS, a `.app` application is technically a bundle directory structure. It is packaged as `music.zip` to preserve macOS file permissions, extended attributes, and bundle integrity.
              - **Installation**: Double-click `music.zip` (or let Safari auto-expand it) to get **`music.app`**. Drag `music.app` into your `/Applications` folder to start listening.

            - **`music.ipa` (iOS & iPadOS Package)**
              - Native universal build supporting both iPhone and iPad with adaptive layouts and multitasking.
              - **Installation**: Install via AltStore, TrollStore, SideStore, Sideloadly, or any preferred iOS sideloading utility.
          files: |
            music.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
