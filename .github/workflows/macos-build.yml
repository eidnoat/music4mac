name: macOS Native Swift CI

on:
  push:
    branches:
      - feat/native-macos-swift
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Run Unit Tests
        run: |
          swift test -v

      - name: Build and Package App
        run: |
          chmod +x ./build_app.sh
          ./build_app.sh

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: music-macOS-App
          path: dist/
