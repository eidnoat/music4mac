name: macOS Native Swift CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Run Unit Tests
        run: |
          swift test -v

      - name: Build and Package App
        run: |
          chmod +x ./build_app.sh
          ./build_app.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-macOS-App
          path: dist/

      - name: Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            music.zip
            *.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
